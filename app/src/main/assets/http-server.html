<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>And JS · 局域网传送</title>
<style>
:root{color-scheme:light dark;font:15px/1.6 system-ui,-apple-system,sans-serif;--bg:#f3f4f0;--card:#fff;--text:#202b27;--muted:#68746c;--line:#dfe5de;--accent:#286549;--soft:#edf3ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:620px;margin:0 auto;padding:44px 20px 28px}header{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:700}h1{font-size:23px;line-height:1.2;margin:0 0 3px;font-weight:650}p{margin:0;color:var(--muted)}.subtitle{font-size:13px}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0}h2{font-size:16px;font-weight:600;margin:0 0 14px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}input,textarea,button{font:inherit}input[type=password],textarea{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:11px 13px;color:var(--text)}textarea{resize:vertical;min-height:136px;max-height:420px}input:focus-visible,textarea:focus-visible,button:focus-visible,.pick:focus-within{outline:2px solid var(--accent);outline-offset:3px}button{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 20px;cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:default}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.hint{font-size:12px;color:var(--muted)}.pick{position:relative;display:block;text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--soft);color:var(--text);cursor:pointer;overflow:hidden}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.pick strong{display:block;font-weight:550;overflow-wrap:anywhere}.pick span{font-size:12px;color:var(--muted)}progress{display:block;width:100%;height:7px;margin:18px 0 6px;accent-color:var(--accent)}.status{font-size:13px;overflow-wrap:anywhere;min-height:22px;margin-top:10px}.status.error{color:#be453a}.secondary{background:var(--soft);color:var(--text)}footer{padding:4px 0;text-align:center;font-size:12px;color:var(--muted)}[hidden]{display:none!important}
@media(prefers-color-scheme:dark){:root{--bg:#151c18;--card:#1e2821;--text:#e6eee8;--muted:#a6b3a9;--line:#364439;--accent:#367956;--soft:#29372d}}
@media(max-width:400px){main{padding:24px 14px}section{padding:18px}}
</style>
<main>
<header><div class="mark" aria-hidden="true">&lt;/&gt;</div><div><h1>And JS</h1><p class="subtitle">局域网传送</p></div></header>
<section><label for="token">访问码</label><input id="token" type="password" maxlength="64" autocomplete="off" placeholder="填写设备上显示的访问码" spellcheck="false"></section>
<section><h2>发送文字</h2><form id="textForm"><label for="text" class="hint">文字会显示在设备的运行窗口</label><textarea id="text" maxlength="2000" placeholder="在这里输入…" required></textarea><div class="row"><span id="count" class="hint">0 / 2000</span><button id="send" type="submit">发送文字</button></div><p id="textStatus" class="status" role="status"></p></form></section>
<section><h2>上传文件</h2><form id="fileForm"><label class="pick"><input id="file" type="file" required><strong id="fileName">选择文件</strong><span id="fileSize">保存到设备的 Download/</span></label><progress id="progress" max="100" value="0" aria-label="上传进度" hidden></progress><p id="fileStatus" class="status" role="status"></p><div class="row"><span class="hint">每次上传一个文件</span><div><button id="cancel" class="secondary" type="button" hidden>取消</button> <button id="upload" type="submit">上传文件</button></div></div></form></section>
<footer>保持设备的运行窗口打开</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
function status(id,text,error=false){$(id).textContent=text;$(id).classList.toggle('error',error)}
function token(){const value=$('token').value;if(!value){$('token').focus();throw Error('请填写访问码')}return value}
function size(bytes){return bytes<1024?bytes+' B':bytes<1048576?(bytes/1024).toFixed(1)+' KB':(bytes/1048576).toFixed(1)+' MB'}
$('text').oninput=()=>{$('count').textContent=$('text').value.length+' / 2000'};
$('textForm').onsubmit=async e=>{e.preventDefault();let code;try{code=token()}catch(err){status('textStatus',err.message,true);return}if(!$('text').value.trim())return;const value=$('text').value;$('send').disabled=true;status('textStatus','发送中…');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch('/text',{method:'POST',headers:{'X-AndJS-Token':code,'Content-Type':'text/plain;charset=UTF-8'},body:value,signal:controller.signal});const data=await r.json();if(!r.ok)throw Error(data.message);status('textStatus','已发送');if($('text').value===value){$('text').value='';$('text').oninput()}}catch(err){status('textStatus',err.name==='AbortError'?'发送超时，请重试':err.message||'连接失败',true)}finally{clearTimeout(timer);$('send').disabled=false}};
$('file').onchange=()=>{const f=$('file').files[0];$('fileName').textContent=f?f.name:'选择文件';$('fileSize').textContent=f?size(f.size):'保存到设备的 Download/';$('progress').hidden=true;status('fileStatus','')};
let current=null;
$('cancel').onclick=()=>{if(current)current.abort()};
$('fileForm').onsubmit=e=>{e.preventDefault();if(current)return;let code;try{code=token()}catch(err){status('fileStatus',err.message,true);return}const f=$('file').files[0];if(!f)return;const xhr=new XMLHttpRequest();current=xhr;let last=0;$('upload').disabled=true;$('file').disabled=true;$('cancel').hidden=false;$('progress').hidden=false;$('progress').value=0;status('fileStatus','准备上传…');xhr.open('POST','/upload?name='+encodeURIComponent(f.name));xhr.setRequestHeader('X-AndJS-Token',code);xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.upload.onprogress=e=>{const now=Date.now();if(now-last<1000 && e.loaded!==e.total)return;last=now;const percent=e.total?Math.floor(e.loaded*100/e.total):0;$('progress').value=percent;status('fileStatus',percent===100?'正在保存…':percent+'% · '+size(e.loaded)+' / '+size(e.total))};xhr.onload=()=>{let data;try{data=JSON.parse(xhr.responseText)}catch(_){status('fileStatus','服务响应异常',true);return}if(xhr.status===200){$('progress').value=100;status('fileStatus',data.name+' · 已保存到 Download/')}else status('fileStatus',data.message||'上传失败',true)};xhr.onerror=()=>status('fileStatus','连接中断，请检查设备并重试',true);xhr.onabort=()=>status('fileStatus','已取消上传');xhr.onloadend=()=>{current=null;$('upload').disabled=false;$('file').disabled=false;$('cancel').hidden=true};xhr.send(f)};
</script>
</html>
