<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>And JS · 局域网编辑</title><style>
:root{font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#282d34;background:#f2f3f5;--muted:#858b94;--line:#e8eaee}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:hover{background:#eceef1}button:focus-visible{outline:2px solid #87958b;outline-offset:2px}header{height:76px;padding:0 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:white}.brand{font-size:23px;font-weight:700;letter-spacing:-.8px}.divider{height:20px;width:1px;background:var(--line)}.muted{color:var(--muted)}.connection{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:#648574}.workspace{display:grid;grid-template-columns:270px 1fr;height:calc(100dvh - 76px);padding:20px;gap:20px}aside{display:flex;flex-direction:column;min-height:0;padding:8px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;padding:0 10px 18px;font-weight:600}.icon{width:30px;height:30px;border-radius:8px;font-size:22px;font-weight:400}.search{background:#e9ebef;border-radius:10px;display:flex;align-items:center;margin:0 0 20px;padding:0 12px;color:var(--muted)}.search input{border:0;outline:0;background:transparent;width:100%;padding:11px 8px;font-size:13px}.list{overflow:auto;flex:1}.item{display:flex;text-align:left;gap:12px;width:100%;padding:14px 12px;border-radius:12px;margin-bottom:5px}.item.active{background:white;box-shadow:0 2px 8px #00000003}.symbol{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#e5ebe7;color:#5e796b;font:15px monospace;flex-shrink:0}.item-name{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{font-size:11px;color:var(--muted);margin-top:3px}.item>div:last-child{min-width:0}.aside-footer{padding:18px 10px 0;font-size:11px;color:var(--muted)}main{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.toolbar{padding:20px 24px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.title-input{font-weight:600;font-size:18px;border:0;outline:none;width:100%;min-width:0;background:transparent}.titlebox{flex:1;min-width:0}.subline{font-size:11px;color:var(--muted);margin-top:4px}.save{background:#292e35;color:white;border-radius:9px;padding:10px 20px;white-space:nowrap}.save:hover{background:#414750}.save:disabled{opacity:.45;cursor:default}.tabs{display:flex;gap:22px;padding:0 24px;border-bottom:1px solid var(--line);align-items:center}.tab{padding:14px 0;color:var(--muted);position:relative}.tab.selected{color:#282d34;font-weight:600}.tab.selected:after{content:'';position:absolute;bottom:-1px;height:2px;left:0;right:0;background:#282d34}.lang{margin-left:auto;font:11px monospace;color:var(--muted)}.editor{display:flex;flex:1;min-height:0;padding-top:20px;background:#fff}.numbers{font:13px/24px 'SFMono-Regular',Consolas,monospace;color:#b2b7bf;text-align:right;width:58px;padding-right:18px;overflow:hidden;white-space:pre;user-select:none}.code{font:13px/24px 'SFMono-Regular',Consolas,monospace;tab-size:2;white-space:pre;resize:none;border:0;outline:0;flex:1;min-width:0;padding:0 24px 30px 0;background:transparent;overflow:auto;color:#3e4d59}.status{display:flex;justify-content:space-between;padding:10px 24px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.params{padding:24px;overflow:auto;flex:1}.param-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.param{display:grid;grid-template-columns:1fr 110px 1.5fr 30px;gap:10px;margin-bottom:10px}.param input,.param select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafbfc;outline:none}.param input:focus{border-color:#87958b}.outline{border:1px solid var(--line);padding:7px 12px;border-radius:8px}.mobileback{display:none}.empty{padding:20px;color:var(--muted);font-size:13px}[hidden]{display:none!important}.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#292e35;color:white;border-radius:10px;padding:11px 20px;box-shadow:0 6px 24px #0002;font-size:13px}@media(max-width:700px){header{height:64px;padding:0 18px}.brand{font-size:21px}.connection span:last-child{display:none}.workspace{height:calc(100dvh - 64px);grid-template-columns:1fr;padding:12px}.workspace:not(.editing) main{display:none}.workspace.editing aside{display:none}.toolbar{padding:16px;gap:8px}.mobileback{display:block;font-size:20px;padding:4px}.tabs{padding:0 16px}.numbers{width:42px;padding-right:12px}.code{font-size:13px}.param{grid-template-columns:1fr 85px;gap:6px}.param input:nth-child(3){grid-column:1}.status{padding:10px 16px}.params{padding:16px}}
.param{align-items:start}.param textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafbfc;outline:none;resize:vertical;min-height:106px;font:13px/1.6 monospace}.param textarea:focus{border-color:#87958b}.boolean-value{width:100%;min-height:43px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fafbfc;display:flex;align-items:center;justify-content:space-between}.switch-track{width:32px;height:19px;background:#c9ced3;border-radius:12px;padding:3px;transition:background .15s}.switch-track:after{content:'';display:block;width:13px;height:13px;border-radius:50%;background:white;transition:transform .15s}.boolean-value[aria-checked=true] .switch-track{background:#648574}.boolean-value[aria-checked=true] .switch-track:after{transform:translateX(13px)}@media(max-width:700px){.param>:nth-child(3){grid-column:1}.param>:last-child{justify-self:end}}
.entry{height:calc(100dvh - 76px);display:grid;place-items:center;padding:24px}.entry form{width:100%;max-width:390px;background:white;border:1px solid var(--line);border-radius:24px;padding:32px}.entry h1{margin:18px 0 4px;font-size:26px}.entry p{margin:0 0 24px}.entry label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.entry input{width:100%;background:#f3f4f6;border:1px solid transparent;outline:0;border-radius:10px;padding:14px;font-size:16px}.entry input:focus{border-color:#87958b}.entry .save{width:100%}.lock{font-size:28px;color:#648574}#login-error{font-size:12px;color:#b84e4e;margin:8px 0;min-height:20px}
</style><body><header><span class="brand">And JS</span><span class="divider"></span><span class="muted">局域网编辑</span><div class="connection"><i class="dot"></i><span>手机脚本</span><span class="muted" id="connection">· 未连接</span></div></header><section class="entry" id="entry"><form id="login"><div class="lock">⌑</div><h1>And JS</h1><p class="muted">连接手机，编辑脚本</p><div id="password-row"><label for="password">访问码</label><input id="password" type="password" autocomplete="current-password" placeholder="输入访问码" maxlength="64"></div><p id="login-error" role="alert"></p><button class="save" type="submit">连接设备 →</button></form></section><div class="workspace" id="workspace" hidden><aside><div class="sectionhead"><span>脚本 <span class="muted" id="count"></span></span><span><button class="icon" id="reload" aria-label="刷新脚本">↻</button><button class="icon" id="new" aria-label="新建脚本">＋</button></span></div><label class="search">⌕ <input id="search" placeholder="搜索脚本" aria-label="搜索脚本"></label><div class="list" id="list"></div><div class="aside-footer">Ctrl / ⌘ + S 保存到手机</div></aside><main><div class="toolbar"><button class="mobileback" id="back" aria-label="返回脚本列表">‹</button><div class="titlebox"><input class="title-input" id="name" aria-label="脚本名称"><div class="subline" id="subtitle">工具</div></div><button class="save" id="save">保存</button></div><div class="tabs"><button class="tab selected" id="code-tab">代码</button><button class="tab" id="param-tab">参数 <span id="param-count"></span></button><span class="lang">JavaScript</span></div><div class="editor" id="editor"><div class="numbers" id="numbers" aria-hidden="true"></div><textarea class="code" id="code" spellcheck="false" aria-label="脚本代码" wrap="off"></textarea></div><div class="params" id="params" hidden><div class="param-head"><span class="muted">脚本参数</span><button class="outline" id="add-param">＋ 添加参数</button></div><div id="param-list"></div></div><div class="status"><span id="state">已保存</span><span id="cursor">行 1，列 1</span></div></main></div><div class="toast" id="toast" hidden role="status"></div><script>
'use strict';const $=id=>document.getElementById(id);let scripts=[];let accessToken='',saving=false;const requiresToken=__REQUIRES_TOKEN__;let current,draft,dirty=false,timer;
function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2200)}
function renderList(){const list=$('list');list.replaceChildren();$('count').textContent=scripts.length;for(const s of scripts.filter(s=>s.name.toLowerCase().includes($('search').value.toLowerCase()))){const b=document.createElement('button');b.className='item'+(s.id===current?' active':'');const icon=document.createElement('span');icon.className='symbol';icon.textContent='‹›';const info=document.createElement('div'),name=document.createElement('div'),meta=document.createElement('div');name.className='item-name';name.textContent=s.name;meta.className='item-meta';meta.textContent=s.category;info.append(name,meta);b.append(icon,info);b.onclick=()=>open(s.id);list.append(b)}if(!list.children.length){const n=document.createElement('div');n.className='empty';n.textContent='没有匹配的脚本';list.append(n)}}
function mark(){dirty=true;$('state').textContent='未保存';$('save').disabled=false}
function lines(){const count=$('code').value.split('\n').length;$('numbers').textContent=Array.from({length:count},(_,i)=>i+1).join('\n');const parts=$('code').value.slice(0,$('code').selectionStart).split('\n');$('cursor').textContent='行 '+parts.length+'，列 '+(parts.at(-1).length+1)}
function renderParams(){
 $('param-count').textContent=draft.params.length?'· '+draft.params.length:'';
 const list=$('param-list');list.replaceChildren();
 draft.params.forEach((p,i)=>{
  const row=document.createElement('div');row.className='param';
  const key=document.createElement('input'),type=document.createElement('select'),remove=document.createElement('button');
  key.value=p.key;key.placeholder='参数名';key.setAttribute('aria-label','参数名');
  for(const t of ['string','number','boolean','array']){const o=document.createElement('option');o.value=t;o.textContent=t;type.append(o)}
  type.value=p.type;type.setAttribute('aria-label','参数类型');
  let value;
  if(p.type==='boolean'){
   value=document.createElement('button');value.type='button';value.className='boolean-value';value.setAttribute('role','switch');value.setAttribute('aria-label','当前值');
   const update=()=>{const on=p.value==='true';value.setAttribute('aria-checked',String(on));value.replaceChildren();const label=document.createElement('span');label.textContent=String(on);const track=document.createElement('i');track.className='switch-track';value.append(label,track)};
   value.onclick=()=>{p.value=p.value==='true'?'false':'true';mark();update()};update();
  }else{
   value=document.createElement(p.type==='array'?'textarea':'input');
   value.className='param-value';value.value=p.value;value.setAttribute('aria-label',p.type==='array'?'JSON 数组或对象':'当前值');
   if(p.type==='number'){value.type='number';value.step='any';value.placeholder='0'}
   else if(p.type==='array'){value.rows=4;value.placeholder='[]';value.spellcheck=false}
   else{value.type='text';value.placeholder='当前值'}
   value.oninput=()=>{p.value=value.value;value.setCustomValidity('');mark()};
  }
  remove.textContent='×';remove.setAttribute('aria-label','删除参数');
  key.oninput=()=>{p.key=key.value;mark()};
  type.onchange=()=>{p.type=type.value;p.value=({string:'',number:'0',boolean:'false',array:'[]'})[p.type];mark();renderParams()};
  remove.onclick=()=>{draft.params.splice(i,1);mark();renderParams()};
  row.append(key,type,value,remove);list.append(row);
 });
 if(!draft.params.length){const n=document.createElement('p');n.className='empty';n.textContent='暂无参数';list.append(n)}
}
function validateParams(){
 for(let i=0;i<draft.params.length;i++){
  const p=draft.params[i];let error='';
  if(p.type==='number'&&(!p.value.trim()||!Number.isFinite(Number(p.value))))error='请输入有效数字';
  if(p.type==='array'){try{if((v=>v===null||typeof v!=='object')(JSON.parse(p.value)))error='请输入 JSON 数组或对象'}catch{error='JSON 数组或对象格式不正确'}}
  if(error){$('param-tab').click();const input=$('param-list').children[i].querySelector('.param-value');input.setCustomValidity(error);input.reportValidity();input.focus();return false}
 }return true;
}

function open(id){if(dirty&&!confirm('放弃未保存的修改？'))return;current=id;draft=structuredClone(scripts.find(s=>s.id===id));$('name').value=draft.name;$('subtitle').textContent=draft.category;$('code').value=draft.code;dirty=false;$('state').textContent='已保存';$('save').disabled=true;renderList();renderParams();lines();$('workspace').classList.add('editing')}
$('code').oninput=()=>{draft.code=$('code').value;mark();lines()};$('code').onclick=lines;$('code').onkeyup=lines;$('code').onscroll=()=>{$('numbers').scrollTop=$('code').scrollTop};$('code').onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const a=e.target.selectionStart,b=e.target.selectionEnd;e.target.setRangeText('  ',a,b,'end');draft.code=e.target.value;mark();lines()}};$('name').oninput=()=>{draft.name=$('name').value;mark()};$('save').onclick=async()=>{
 if(saving||!draft||!dirty)return;if(!validateParams())return;
 if(!draft.name.trim()||draft.name.trim().length>40){notify('脚本名称须为 1–40 字符');return}
 const keys=draft.params.map(p=>p.key.trim());if(keys.some(k=>!k)||new Set(keys).size!==keys.length){notify('参数名不能为空或重复');return}
 const payload=structuredClone(draft);payload.name=payload.name.trim();saving=true;$('workspace').inert=true;$('save').textContent='保存中…';
 try{const data=await api('/save',{method:'POST',body:JSON.stringify(payload)});draft=data.script;scripts=scripts.map(s=>s.id===current?draft:s);dirty=false;$('state').textContent='已保存到手机';$('save').disabled=true;renderList();notify('已保存到手机')}
 catch(e){notify(e.message);$('state').textContent='保存失败 · 修改已保留'}
 finally{saving=false;$('workspace').inert=false;$('save').textContent='保存'}
};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('save').click()}});$('search').oninput=renderList;$('new').onclick=()=>{if(dirty&&!confirm('放弃未保存的修改？'))return;dirty=false;const s={id:Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join(''),name:'新脚本',category:'未分类',code:'',params:[]};scripts.unshift(s);open(s.id);mark();$('name').focus();$('name').select()};$('add-param').onclick=()=>{draft.params.push({key:'',type:'string',value:''});mark();renderParams()};for(const t of ['code','param'])$(t+'-tab').onclick=()=>{$('code-tab').classList.toggle('selected',t==='code');$('param-tab').classList.toggle('selected',t==='param');$('editor').hidden=t!=='code';$('params').hidden=t!=='param'};$('back').onclick=()=>$('workspace').classList.remove('editing');window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});async function api(path,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{const response=await fetch(path,{...options,headers:{'X-AndJS-Token':accessToken,'Content-Type':'application/json'},cache:'no-store',signal:controller.signal});const data=await response.json();if(!response.ok)throw Error(data.message||'请求失败');return data}
 catch(e){if(e.name==='AbortError')throw Error('连接超时，请重试');throw e}finally{clearTimeout(timer)}
}
async function loadScripts(){
 const data=await api('/scripts');scripts=data.scripts;dirty=false;
 if(scripts.length){open(scripts.some(s=>s.id===current)?current:scripts[0].id);document.querySelector('main').hidden=false}
 else{draft=null;current=null;renderList();document.querySelector('main').hidden=true}
 if(innerWidth<=700)$('workspace').classList.remove('editing');
}
const originalNew=$('new').onclick;$('new').onclick=()=>{originalNew();if(draft)document.querySelector('main').hidden=false};
$('reload').onclick=async()=>{if(dirty&&!confirm('放弃未保存的修改并刷新？'))return;try{await loadScripts();notify('已刷新')}catch(e){notify(e.message)}};
$('password-row').hidden=!requiresToken;
$('login').onsubmit=async e=>{
 e.preventDefault();const button=$('login').querySelector('button');button.disabled=true;accessToken=requiresToken?$('password').value:'';$('login-error').textContent='';
 try{await api('/auth',{method:'POST',body:''});await loadScripts();$('entry').hidden=true;$('workspace').hidden=false;$('connection').textContent='· 已连接';$('password').value=''}
 catch(e){$('login-error').textContent=e.message}finally{button.disabled=false}
};
if(!requiresToken)$('login').requestSubmit();
</script></body></html>
